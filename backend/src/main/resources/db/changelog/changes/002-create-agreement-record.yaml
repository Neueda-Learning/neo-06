# UC 00 · Process Application's real table — replaces the demo_showcase placeholder.
#
# Columns for every currently-implemented use case: applicationId (PK, the ONLY applicant-related
# column this schema ever stores), status, the terms/limits fields UC 02 reads, and the timestamps
# the lifecycle stamps as it moves the case along. See
# module-06-agreement-management-docs/uc-00-process-application.md and uc-02-review-agreement.md's
# suggested entity model for the full shape.
#
# NEVER EDIT THIS FILE once it has run — add a new change set instead (Liquibase checksums every
# applied one; editing this is a crash-loop on any database that already applied it).
databaseChangeLog:
  - changeSet:
      id: 002-create-agreement-record
      author: neo-06
      changes:
        - createTable:
            tableName: agreement_record
            columns:
              - column:
                  # The id from the request ENVELOPE, not from inside the application object —
                  # the primary key itself, not a surrogate.
                  name: application_id
                  type: VARCHAR(64)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  # GENERATING | PENDING | SIGNED | DECLINED | EXPIRED — stored as text so the
                  # database is readable. GENERATING is internal; UC 00 never reports it on the
                  # orchestrator callback.
                  name: status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: reference
                  type: VARCHAR(32)
              - column:
                  name: envelope_id
                  type: VARCHAR(64)
              - column:
                  name: terms_version
                  type: VARCHAR(32)
              - column:
                  name: approved_limit
                  type: INT
              - column:
                  name: apr
                  type: DECIMAL(5,2)
              - column:
                  name: min_payment_gbp
                  type: INT
              - column:
                  name: sent_at
                  type: TIMESTAMP
              - column:
                  name: expires_at
                  type: TIMESTAMP
              - column:
                  name: signed_at
                  type: TIMESTAMP
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            tableName: agreement_record
            indexName: idx_agreement_record_status
            columns:
              - column:
                  name: status
      rollback:
        - dropTable:
            tableName: agreement_record
