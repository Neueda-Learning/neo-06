# demo_showcase is fully replaced by agreement_record (002) — nothing references it any more.
#
# NEVER EDIT THIS FILE once it has run — add a new change set instead.
databaseChangeLog:
  - changeSet:
      id: 004-drop-demo-showcase
      author: neo-06
      changes:
        - dropTable:
            tableName: demo_showcase
      rollback:
        - createTable:
            tableName: demo_showcase
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: application_id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
