# UC 06 · Receive Signature Events — the columns its guard and its SIGNED transition need.
#
# envelope_id: the CURRENT envelope registered with the e-sign mock — null until the decision
# engine (UC 05, not yet built) sends the case for signature; a resend rotates it.
# signed_at: stamped with the event's own occurredAt when the customer signs; null otherwise.
#
# NEVER EDIT THIS FILE once it has run — add a new change set instead.
databaseChangeLog:
  - changeSet:
      id: 004-add-signature-event-columns
      author: neo-06
      changes:
        - addColumn:
            tableName: agreement_record
            columns:
              - column:
                  name: envelope_id
                  type: VARCHAR(64)
                  constraints:
                    nullable: true
              - column:
                  name: signed_at
                  type: TIMESTAMP
                  constraints:
                    nullable: true
      rollback:
        - dropColumn:
            tableName: agreement_record
            columnName: envelope_id
        - dropColumn:
            tableName: agreement_record
            columnName: signed_at
